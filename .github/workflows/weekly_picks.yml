name: Weekly Momentum Picks

on:
  schedule:
    - cron: '30 11 * * 0'   # Sunday 11:30 UTC = 5:00pm IST
  workflow_dispatch:
    inputs:
      nifty50:
        description: 'Run Nifty 50'
        type: boolean
        default: true
      etf_india:
        description: 'Run ETF India 2026'
        type: boolean
        default: true
      dax40:
        description: 'Run DAX 40'
        type: boolean
        default: true
      modes:
        description: 'Modes (comma-separated: returns,sharpe,sortino)'
        type: string
        default: 'returns,sharpe,sortino'
      top_n:
        description: 'Top N picks per universe'
        type: string
        default: '10'

jobs:
  weekly-picks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Resolve inputs (scheduled runs use all defaults) ────────────
      - name: Resolve inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "nifty50=true"      >> $GITHUB_OUTPUT
            echo "etf_india=true"    >> $GITHUB_OUTPUT
            echo "dax40=true"        >> $GITHUB_OUTPUT
            echo "modes=returns,sharpe,sortino" >> $GITHUB_OUTPUT
            echo "top_n=10"          >> $GITHUB_OUTPUT
          else
            echo "nifty50=${{ inputs.nifty50 }}"   >> $GITHUB_OUTPUT
            echo "etf_india=${{ inputs.etf_india }}" >> $GITHUB_OUTPUT
            echo "dax40=${{ inputs.dax40 }}"       >> $GITHUB_OUTPUT
            echo "modes=${{ inputs.modes }}"       >> $GITHUB_OUTPUT
            echo "top_n=${{ inputs.top_n }}"       >> $GITHUB_OUTPUT
          fi

      # ── Nifty 50 ────────────────────────────────────────────────────
      - name: Run Nifty 50
        if: steps.inputs.outputs.nifty50 == 'true'
        run: |
          IFS=',' read -ra MODES <<< "${{ steps.inputs.outputs.modes }}"
          for mode in "${MODES[@]}"; do
            mode=$(echo "$mode" | xargs)
            echo "Running Nifty 50 — $mode"
            python pipeline.py \
              --universe config/universes/nifty50.yaml \
              --mode "$mode" \
              --top-n ${{ steps.inputs.outputs.top_n }} \
              --passing-only \
              --output csv
          done

      # ── ETF India 2026 ──────────────────────────────────────────────
      - name: Run ETF India 2026
        if: steps.inputs.outputs.etf_india == 'true'
        run: |
          IFS=',' read -ra MODES <<< "${{ steps.inputs.outputs.modes }}"
          for mode in "${MODES[@]}"; do
            mode=$(echo "$mode" | xargs)
            echo "Running ETF India 2026 — $mode"
            python pipeline.py \
              --universe config/universes/etf_india_2026.yaml \
              --mode "$mode" \
              --top-n ${{ steps.inputs.outputs.top_n }} \
              --passing-only \
              --output csv
          done

      # ── DAX 40 ──────────────────────────────────────────────────────
      - name: Run DAX 40
        if: steps.inputs.outputs.dax40 == 'true'
        run: |
          IFS=',' read -ra MODES <<< "${{ steps.inputs.outputs.modes }}"
          for mode in "${MODES[@]}"; do
            mode=$(echo "$mode" | xargs)
            echo "Running DAX 40 — $mode"
            python pipeline.py \
              --universe config/universes/dax40.yaml \
              --mode "$mode" \
              --top-n ${{ steps.inputs.outputs.top_n }} \
              --passing-only \
              --output csv
          done

      # ── Generate markdown report ─────────────────────────────────────
      - name: Generate report
        run: python scripts/generate_report.py --date $(date +%Y%m%d) --output-dir output/runs

      # ── Cleanup ─────────────────────────────────────────────────────
      - name: Delete cache and pycache
        run: |
          rm -rf data/cache/
          find . -type d -name __pycache__ -exec rm -rf {} +

      # ── Commit CSVs + MD to picks/weekly branch ──────────────────────
      - name: Commit to picks/weekly branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B picks/weekly
          git add output/runs/*.csv output/runs/*.md
          git diff --cached --quiet && echo "No changes to commit" || \
          git commit -m "chore(picks): weekly run $(date +%Y-%m-%d)"
          git push origin picks/weekly --force-with-lease
